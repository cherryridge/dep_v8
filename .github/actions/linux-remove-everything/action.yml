name: V8 Linux Remove Everything
description: V8 Linux Remove Everything

runs:
  using: composite
  steps:
    - name: Remove Everything to Free Up Space
      shell: bash
      run: |
        set -euo pipefail
        df -h /
        sudo apt-get update

        # Select optional software from this runner's installed package database.
        candidates=$(dpkg-query -W -f='${Package}\t${Status}\t${Essential}\t${Protected}\t${binary:Package}\n' |
          awk -F '\t' '
            $2 != "install ok installed" || $3 == "yes" || $4 == "yes" { next }
            $1 ~ /^(azure-cli|google-cloud-cli|google-chrome-stable|microsoft-edge-stable|firefox)$/ ||
            $1 ~ /^(ant|ant-optional|temurin-[0-9]+-jdk)$/ ||
            $1 ~ /^(buildah|podman|containerd[.]io|docker-ce|docker-ce-cli)$/ ||
            $1 ~ /^php[0-9]+[.][0-9]+(-[a-z0-9-]+)?$/ ||
            $1 ~ /^postgresql-(client-)?[0-9]+(-jit)?$/ ||
            $1 ~ /^mysql-(client|server)(-core)?$/ { print $5 }
          ')
        if [[ -n "$candidates" ]]; then
          mapfile -t packages <<< "$candidates"
          sudo apt-get remove -y -- "${packages[@]}"
        fi

        # Large preinstalled SDKs that the V8 build does not use.
        sudo rm -rf -- /usr/local/lib/android /usr/local/.ghcup /usr/local/share/vcpkg \
          /usr/local/swift /usr/share/dotnet /opt/hostedtoolcache/CodeQL

        sudo apt-get install -y clang gcc-14 g++-14
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
        sudo apt-get clean
        df -h /